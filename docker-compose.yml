services:
  postgres:
    image: postgis/postgis:16-3.4-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      # Host 5433, not 5432 — this machine already runs a native postgres
      # service on 5432 unrelated to this project.
      - "5433:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    restart: unless-stopped
    env_file: .env
    environment:
      # .env is tuned for local `pnpm dev` against the dockerized db/ports
      # (127.0.0.1, PORT=3001 to dodge a conflicting local service) —
      # inside this network the container needs the service hostnames and
      # its own internal port instead.
      DATABASE_URL: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379
      PORT: 3000
    depends_on:
      - postgres
      - redis
    ports:
      - "3001:3000"

  telegram-app:
    build:
      context: .
      dockerfile: apps/telegram-app/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - api

  # Публичный HTTPS для Telegram: Mini App открывает клиент на телефоне
  # покупателя, и localhost-адрес — хоть с сертификатом, хоть без — ему
  # недоступен. Профиль, а не обычный сервис: обычная разработка идёт по
  # 127.0.0.1:8080 и наружу не светится.
  #   docker compose --profile tunnel up -d
  #   docker compose logs tunnel | grep trycloudflare
  # Туннель смотрит на telegram-app, а не на api: фронт и API живут за одним
  # origin (nginx проксирует /api), поэтому туннель нужен ровно один.
  tunnel:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2025.8.1
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://telegram-app:80
    depends_on:
      - telegram-app

volumes:
  pgdata:
