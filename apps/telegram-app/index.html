<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Микки Шоп</title>
    <!-- Официальный клиент Mini App. Грузится с telegram.org, а не из npm:
         Telegram обновляет его вместе со своими приложениями, и запиненная
         копия отстала бы от клиента. Вне Telegram скрипт всё равно создаёт
         window.Telegram — с platform "unknown" и заглушками вместо кнопок,
         поэтому «мы в Telegram» проверяется по platform, а не по объекту
         (см. lib/telegram.ts). -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
