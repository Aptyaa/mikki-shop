server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Приложение отдаётся наружу по HTTPS (туннель/домен), а до nginx запрос
    # доходит по http — свой редирект он собрал бы с http-схемой и хостом
    # контейнера, то есть увёл бы клиента Telegram с HTTPS в никуда.
    # Проверено: без этого GET /api отвечал Location: http://<хост>/api/.
    absolute_redirect off;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # API под тем же origin, что и приложение. Не ради удобства: Mini App
    # открывается по HTTPS-адресу туннеля/домена, и запрос на отдельный
    # http-хост API браузер Telegram зарежет как mixed content. Один origin
    # заодно снимает CORS и оставляет наружу ровно один туннель.
    location /api/ {
        # Резолвер докера + адрес в переменной: без этого nginx резолвит `api`
        # один раз на старте и падает с "host not found in upstream", если API
        # ещё не поднялся (depends_on ждёт запуска контейнера, а не готовности).
        resolver 127.0.0.11 valid=10s;
        set $api_upstream http://api:3000;
        # proxy_pass с переменной не срезает префикс сам — срезаем rewrite'ом:
        # у NestJS нет глобального префикса, ручки лежат в корне (/catalog, /auth).
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
