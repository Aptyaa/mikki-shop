<!doctype html><html lang="ru"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:0;background:var(--bg-page);height:260px;box-sizing:border-box;overflow:hidden;font-family:var(--font-body)}
.pg{padding:0 20px}
.band{background:var(--action-primary);color:var(--text-on-primary);display:flex;justify-content:space-between;padding:12px 20px;font:600 13px var(--font-body)}
.hero{background:var(--action-primary);padding:16px 20px 14px;display:flex;align-items:flex-end;gap:14px}
.hero .wm{font-family:var(--font-wordmark);font-size:26px;color:var(--olive-900);flex:1;line-height:1}
.hero .disc{width:60px;height:60px;border-radius:999px;background:var(--surface-inverse);display:grid;place-items:center;overflow:hidden;margin-bottom:-5px;flex-shrink:0}
.hero .disc img{width:54px;display:block}
.row{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--border-subtle)}
.im{width:52px;height:65px;background:var(--surface-sunken);border-radius:2px;flex-shrink:0}
.nm{font:500 14px var(--font-body);color:var(--text-heading)}
.mt{font:400 12px var(--font-body);color:var(--text-muted);margin-top:3px}
.dot{display:inline-block;width:5px;height:5px;border-radius:999px;background:var(--rating-star);margin-right:6px;vertical-align:1px}
.pr{font:600 14px var(--font-body);color:var(--text-heading);text-align:right;white-space:nowrap}
.pr del{display:block;font-weight:400;font-size:11px;color:var(--text-muted);margin-top:2px}</style></head><body>
<div class="hero"><div class="wm">Микки Шоп</div><span class="disc"><img src="../assets/mascot-mark.png" alt=""></span></div>
<div class="pg">
<div class="row"><div class="im"></div><div style="flex:1"><div class="nm">Вязаный свитер «Сахарок»</div><div class="mt"><span class="dot"></span>меринос · XS–M · осталось 4</div></div><div class="pr">1 490 ₽<del>2 190 ₽</del></div></div>
<div class="row"><div class="im"></div><div style="flex:1"><div class="nm">Бандана «Клетка»</div><div class="mt">хлопок · S–M</div></div><div class="pr">590 ₽</div></div>
</div>
<div class="band" style="margin-top:14px"><span>Доставка от 3 000 ₽</span><span>бесплатно</span></div>
</body></html>
