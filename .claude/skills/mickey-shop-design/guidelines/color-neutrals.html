<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Neutrals</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg-page);height:150px;box-sizing:border-box;overflow:hidden}
.sw{display:flex;gap:8px}.sw>div{flex:1;display:flex;flex-direction:column;gap:6px}
.chip{height:56px;border-radius:var(--r-md);box-shadow:inset 0 0 0 1px rgba(36,26,18,.06)}
.nm{font:600 11px/1.2 var(--font-body);color:var(--text-heading)}
.hx{font:400 10px/1.2 var(--font-mono);color:var(--text-muted);letter-spacing:.02em}
.tk{font:400 10px/1.2 var(--font-mono);color:var(--ink-300)}
.row{display:flex;gap:12px;align-items:baseline}</style></head><body><div class="sw">
<div><div class="chip" style="background:#241A12"></div><div class="nm">ink 900</div><div class="hx">#241A12</div></div><div><div class="chip" style="background:#4A3A2D"></div><div class="nm">ink 700</div><div class="hx">#4A3A2D</div><div class="tk">--text-body</div></div><div><div class="chip" style="background:#6B5B4E"></div><div class="nm">ink 500</div><div class="hx">#6B5B4E</div><div class="tk">--text-muted</div></div><div><div class="chip" style="background:#9C8B7C"></div><div class="nm">ink 300</div><div class="hx">#9C8B7C</div></div><div><div class="chip" style="background:#EFE3D3"></div><div class="nm">line 200</div><div class="hx">#EFE3D3</div><div class="tk">--border-subtle</div></div><div><div class="chip" style="background:#E0D0B9"></div><div class="nm">line 300</div><div class="hx">#E0D0B9</div><div class="tk">--border-strong</div></div>
</div></body></html>
