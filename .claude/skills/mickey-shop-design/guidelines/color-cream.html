<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Surfaces</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg-page);height:150px;box-sizing:border-box;overflow:hidden}
.sw{display:flex;gap:8px}.sw>div{flex:1;display:flex;flex-direction:column;gap:6px}
.chip{height:56px;border-radius:var(--r-md);box-shadow:inset 0 0 0 1px rgba(0,0,0,.07)}
.nm{font:600 11px/1.2 var(--font-body);color:var(--text-heading)}
.hx{font:400 10px/1.2 var(--font-mono);color:var(--text-muted);letter-spacing:.02em}
.tk{font:400 10px/1.2 var(--font-mono);color:var(--ink-300)}</style></head><body><div class="sw">
<div><div class="chip" style="background:#FFFFFF"></div><div class="nm">card</div><div class="hx">#FFFFFF</div><div class="tk">--surface-card</div></div><div><div class="chip" style="background:#FFFDF4"></div><div class="nm">elevated</div><div class="hx">#FFFDF4</div><div class="tk">--bg-elevated</div></div><div><div class="chip" style="background:#FDF8E1"></div><div class="nm">page</div><div class="hx">#FDF8E1</div><div class="tk">--bg-page</div></div><div><div class="chip" style="background:#FDF4CB"></div><div class="nm">sunken</div><div class="hx">#FDF4CB</div><div class="tk">--surface-sunken</div></div><div><div class="chip" style="background:#FCEFB4"></div><div class="nm">tint</div><div class="hx">#FCEFB4</div><div class="tk">--surface-tint</div></div><div><div class="chip" style="background:#3B3418"></div><div class="nm">inverse</div><div class="hx">#3B3418</div><div class="tk">--surface-inverse</div></div>
</div></body></html>
