<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Wordmark</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg-page);height:230px;box-sizing:border-box;overflow:hidden}
.wm{font-family:var(--font-wordmark);font-weight:400;letter-spacing:.01em;white-space:nowrap}
.tk{font:400 10px/1.4 var(--font-mono);color:var(--ink-300)}
.no{color:var(--danger-500)}</style></head><body>
<div style="display:flex;gap:34px;align-items:center;flex-wrap:wrap">
<div style="display:flex;align-items:center;gap:12px"><img src="../assets/mascot-mark.png" style="width:54px" alt=""><span class="wm" style="font-size:40px;color:var(--text-heading)">Микки Шоп</span></div>
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><img src="../assets/mascot-mark.png" style="width:42px" alt=""><span class="wm" style="font-size:22px;color:var(--text-heading)">Микки Шоп</span></div>
<div style="background:var(--surface-inverse);padding:14px 20px;border-radius:var(--r-lg);display:flex;align-items:center;gap:11px"><img src="../assets/mascot-mark.png" style="width:34px" alt=""><span class="wm" style="font-size:26px;color:var(--text-inverse)">Mickey Shop</span></div>
<div style="display:flex;align-items:center;gap:10px"><img src="../assets/mascot-mark-mono.svg" style="width:40px" alt=""><span class="wm" style="font-size:26px;color:var(--text-heading)">Микки Шоп</span><span class="tk">mono</span></div>
</div>
<div class="tk" style="margin-top:16px">Отступ = высота знака ÷ 2 со всех сторон. <span class="no">Контурный шрифт: внутренности букв берут фон — никогда поверх фотографии, никогда мельче 20px, никогда для заголовков.</span> Заголовки — Baloo 2.</div>
</body></html>
