<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Pairing</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg-page);height:180px;box-sizing:border-box;overflow:hidden}
.sw{display:flex;gap:8px}.sw>div{flex:1;display:flex;flex-direction:column;gap:6px}
.chip{height:56px;border-radius:var(--r-md);box-shadow:inset 0 0 0 1px rgba(36,26,18,.06)}
.nm{font:600 11px/1.2 var(--font-body);color:var(--text-heading)}
.hx{font:400 10px/1.2 var(--font-mono);color:var(--text-muted);letter-spacing:.02em}
.tk{font:400 10px/1.2 var(--font-mono);color:var(--ink-300)}
.row{display:flex;gap:12px;align-items:baseline}</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:20px;align-items:start">
<div><div class="tk">WORDMARK · Bubblez Graffiti · только вывеска, ≥20px</div>
<div style="font-family:var(--font-wordmark);font-weight:400;font-size:40px;line-height:1.1;color:var(--text-heading);margin-top:6px">Микки Шоп</div>
<div style="font-family:var(--font-display);font-weight:800;font-size:26px;color:var(--text-heading);margin-top:12px">Новинки недели</div><div class="tk" style="margin-top:4px">DISPLAY · Baloo 2 800</div></div>
<div><div class="tk">BODY · Onest · 300 400 500 600 700 800</div>
<div style="font-family:var(--font-body);font-weight:400;font-size:15px;line-height:1.5;color:var(--text-body);margin-top:6px">Одежда, в которой собаке не мешает гулять. Мы шьём небольшими партиями и примеряем каждую модель на живой собаке.</div>
<div style="font-family:var(--font-body);font-weight:600;font-size:13px;color:var(--text-heading);margin-top:6px">Аа Бб Вв · Aa Bb Cc · 1 490 ₽</div></div>
</div></body></html>
