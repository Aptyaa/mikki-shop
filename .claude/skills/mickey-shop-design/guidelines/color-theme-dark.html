<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Dark</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg-page);height:190px;box-sizing:border-box;overflow:hidden}
.sw{display:flex;gap:8px}.sw>div{flex:1;display:flex;flex-direction:column;gap:6px}
.chip{height:56px;border-radius:var(--r-md);box-shadow:inset 0 0 0 1px rgba(0,0,0,.07)}
.nm{font:600 11px/1.2 var(--font-body);color:var(--text-heading)}
.hx{font:400 10px/1.2 var(--font-mono);color:var(--text-muted);letter-spacing:.02em}
.tk{font:400 10px/1.2 var(--font-mono);color:var(--ink-300)}</style></head><body>
<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">
<div style="background:#FDF8E1;padding:12px;border-radius:var(--r-md)">
  <div style="font:700 15px var(--font-display);color:#2A2510">Светлая</div>
  <div style="margin-top:8px;background:#fff;border:1px solid #F0E9CE;border-radius:var(--r-md);padding:10px">
    <div style="font:500 12px var(--font-body);color:#4E4728">Вязаный свитер «Сахарок»</div>
    <div style="font:800 16px var(--font-display);color:#2A2510;margin-top:4px">1 490 ₽</div>
    <div style="margin-top:8px;display:inline-block;background:#F9DC5C;color:#2A2510;font:700 12px var(--font-display);padding:6px 14px;border-radius:999px">В корзину</div></div></div>
<div data-theme="dark" style="background:#191509;padding:12px;border-radius:var(--r-md)">
  <div style="font:700 15px var(--font-display);color:#FDF8E1">Тёмная</div>
  <div style="margin-top:8px;background:#2A2411;border:1px solid #332C14;border-radius:var(--r-md);padding:10px">
    <div style="font:500 12px var(--font-body);color:#DCD5BC">Вязаный свитер «Сахарок»</div>
    <div style="font:800 16px var(--font-display);color:#FFFDF4;margin-top:4px">1 490 ₽</div>
    <div style="margin-top:8px;display:inline-block;background:#F9DC5C;color:#221D0D;font:700 12px var(--font-display);padding:6px 14px;border-radius:999px">В корзину</div></div></div>
</div>
<div class="tk" style="margin-top:12px">Заливка кнопки одна и та же в обеих темах — жёлтый достаточно тёмный для светлой и достаточно светлый для тёмной. Меняется только текст на ней.</div></body></html>
