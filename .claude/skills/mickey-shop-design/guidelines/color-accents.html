<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Roles</title><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--bg-page);height:170px;box-sizing:border-box;overflow:hidden}
.sw{display:flex;gap:8px}.sw>div{flex:1;display:flex;flex-direction:column;gap:6px}
.chip{height:56px;border-radius:var(--r-md);box-shadow:inset 0 0 0 1px rgba(0,0,0,.07)}
.nm{font:600 11px/1.2 var(--font-body);color:var(--text-heading)}
.hx{font:400 10px/1.2 var(--font-mono);color:var(--text-muted);letter-spacing:.02em}
.tk{font:400 10px/1.2 var(--font-mono);color:var(--ink-300)}</style></head><body><div class="sw">
<div><div class="chip" style="background:#6B5807"></div><div class="nm">--nav-active</div><div class="hx">#6B5807</div><div class="tk">активный таб</div></div><div><div class="chip" style="background:#9C800C"></div><div class="nm">--accent-fav</div><div class="hx">#9C800C</div><div class="tk">сердечко</div></div><div><div class="chip" style="background:#F2CE33"></div><div class="nm">--rating-star</div><div class="hx">#F2CE33</div><div class="tk">звёзды</div></div><div><div class="chip" style="background:#FAE588"></div><div class="nm">--ornament</div><div class="hx">#FAE588</div><div class="tk">• • •</div></div><div><div class="chip" style="background:#6B5807"></div><div class="nm">--text-price-sale</div><div class="hx">#6B5807</div><div class="tk">цена со скидкой</div></div><div><div class="chip" style="background:#FAE588"></div><div class="nm">--border-tint</div><div class="hx">#FAE588</div><div class="tk">рамка tint</div></div>
</div>
<div class="tk" style="margin-top:14px">В Cream роль <b>--accent-fav</b> отвечает ягодой, в Sunbeam — туманно-синим. Компонент знает только роль.</div></body></html>
